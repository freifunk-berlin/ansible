---
- name: Install nginx
  ansible.builtin.apt:
    name:
      - nginx
    state: present
    update_cache: true
    cache_valid_time: 3600


- name: Create directories
  ansible.builtin.file:
    dest: "{{ item }}"
    state: directory
    mode: "0755"
    owner: www-data
    group: www-data
  loop:
    - /opt/tilecache

- name: Copy nginy Config
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
  notify: Restart nginx

