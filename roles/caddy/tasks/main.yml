---
- name: Add caddy repo
  ansible.builtin.deb822_repository:
    name: caddy
    types:
      - deb
    uris: https://dl.cloudsmith.io/public/caddy/stable/deb/debian
    suites: any-version
    components: main
    signed_by: https://dl.cloudsmith.io/public/caddy/stable/gpg.key

- name: Install dependencies
  ansible.builtin.apt:
    name:
      - caddy
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Copy caddyfile
  ansible.builtin.template:
    dest: /etc/caddy/Caddyfile
    src: "{{ caddy_caddyfile }}"
    mode: "0640"
    owner: caddy
    group: caddy
  notify: Restart caddy

- name: Copy Dirlist template
  ansible.builtin.copy:
    dest: /etc/caddy/ff_dirlisting_template.html
    src: "ff_dirlisting_template.html"
    mode: "0640"
    owner: caddy
    group: caddy
