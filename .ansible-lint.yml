---
# Use Production Profile
profile: production

# Do not check venv or external roles
exclude_paths:
  - venv/
  - external_roles/
  - collections/
  - .github/
  - .git/
  - roles/ff_monitor/files/snmp.yml  # File is autogenerated

# Use default rules as a baseline
use_default_rules: true

skip_list:
  - experimental
